# Sistema de Fotos Clinicas (Instituto Sharon): front + API. O banco e o container ja existente "sharon-db";
# o tunel (cloudflared) e o do stack sharon-prod, que passa a atender institutosharonfotos.mouora.com.
# Subir/atualizar: bash scripts/subir-docker.sh
name: sharon-fotos
services:
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    container_name: sharon-fotos-api
    restart: unless-stopped
    env_file: [apps/api/.env.docker] # gerado por scripts/gerar-env-docker.sh (nao vai para o Git)
    volumes: [./apps/api/secrets:/app/secrets:ro]
    networks: [default, banco]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_DEV_LOGIN: ${NEXT_PUBLIC_DEV_LOGIN:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    container_name: sharon-fotos-web
    restart: unless-stopped
    depends_on: [api]
    networks: [default, tunel]
    mem_limit: 384m
    security_opt: [no-new-privileges:true]

networks:
  banco: { name: instituto-sharon_default, external: true } # rede do container sharon-db
  tunel: { name: sharon-prod_internal, external: true } # rede do cloudflared
